<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<body>
    <style>
        body{
            background:#f2f2f2;
        }

        .token-box{
            width:350px;
            margin:auto;
            margin-top:80px;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
            text-align:center;
        }

        .token-number{
            font-size:60px;
            font-weight:bold;
            color:#0d6efd;
            margin:20px 0;
        }

        ul{
            list-style:none;
            padding:0;
        }

        li{
            background:#e9ecef;
            margin:5px;
            padding:10px;
            border-radius:5px;
        }
    </style>
</head>
<body>

    <div class="token-box">

        <h2 class="mb-4">Token Generator</h2>

        <div class="token-number" id="tokenDisplay">
            0
        </div>

        <button class="btn btn-primary m-2" onclick="generateToken()">
            Generate Token
        </button>

        <button class="btn btn-danger m-2" onclick="resetToken()">
            Reset
        </button><br><br>
        <a href="/sixth" class="btn btn-dark">Send</a>

        <hr>

        <h5>Generated Tokens</h5>

        <ul id="tokenList"></ul>

    </div>

    <script>

        let token = 0;

        function generateToken(){

            token++;

            document.getElementById("tokenDisplay").innerHTML = token;

            let list = document.getElementById("tokenList");

            let li = document.createElement("li");

            li.innerHTML = "Token Number : " + token;

            list.prepend(li);
        }

        function resetToken(){

            token = 0;

            document.getElementById("tokenDisplay").innerHTML = 0;

            document.getElementById("tokenList").innerHTML = "";
        }

    </script>

</body>
</html>
