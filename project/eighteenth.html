<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="prescription">

    <div class="header">
        <h1>DR. SAMYUKTHA MENON</h1>
        <p>MBBS, MD | GYNECOLOGY SPECIALIST</p>
        <p>Phone: 8991001580</p>
    </div>

    <hr>

    <div class="patient">
        <h3>Patient Details</h3>

        <label>Name:</label>
        <input type="text" id="pname"><br>

        <label>Age:</label>
        <input type="number" id="age"><br>

        <label>Date:</label>
        <input type="date" id="date">
    </div>


    <h3>Prescription</h3>

    <table id="medicineTable">

        <tr>
            <th>Medicine</th>
            <th>Dosage</th>
            <th>Duration</th>
        </tr>

        <tr>
            <td><input type="text"></td>
            <td><input type="text"></td>
            <td><input type="text"></td>
        </tr>

    </table>

    <button onclick="addMedicine()">Add Medicine</button>


    <br><br>

    <label>Doctor Notes:</label>
    <textarea id="notes"></textarea>


    <br>

    <button onclick="printPrescription()">
        Print Prescription
    </button>


</div>


<script src="script.js"></script>


<style>
    body{
    background:#eee;
    font-family:Arial;
}


.prescription{

    width:700px;
    margin:30px auto;
    background:white;
    padding:30px;
    border:2px solid #333;
    box-shadow:0 0 10px gray;

}


.header{
    text-align:center;
    color:aqua;
}


label{
    display:inline-block;
    width:100px;
    margin:10px;
}


input,textarea{

    padding:8px;
    width:60%;

}


textarea{
    height:80px;
}


table{

    width:100%;
    border-collapse:collapse;

}


th,td{

    border:1px solid #555;
    padding:10px;

}


button{

    margin:15px;
    padding:10px 20px;
    background:#0066cc;
    color:white;
    border:none;
    cursor:pointer;

}


button:hover{

    background:#004999;

}


@media print{

    button{
        display:none;
    }

    body{
        background:white;
    }

}
</style>

<script>
    function addMedicine(){

    let table=document.getElementById("medicineTable");

    let row=table.insertRow();

    row.innerHTML=
    `
    <td><input type="text"></td>
    <td><input type="text"></td>
    <td><input type="text"></td>
    `;

}


function printPrescription(){

    let name=document.getElementById("pname").value;

    if(name=="")
    {
        alert("Enter patient name");
        return;
    }


    window.print();

}
</script>


</body>
</html>
