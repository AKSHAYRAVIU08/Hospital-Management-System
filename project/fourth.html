<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<body>
    <div class="container">
        <form method="post">
            {% csrf_token %}

            {% if messages %}
            {% for message in messages %}
            <div>
                {{message}}
            </div>
            {% endfor %}
            {% endif %}
            <h1 style="color: blueviolet;"><b>APPLICATION FORM FOR PATIENTS</b></h1>
            <p><b style="color: teal;">PLEASE FILL THE BELOW FORM</b></p>
            <label for="patient_name" style="color: indigo;">PATIENT NAME</label><br><br>
            <input type="patient_name" id="patient_name" name="patient_name"><br><br>
            <label for="address" style="color: indigo;">ADDRESS</label><br><br>
            <input type="address" id="address" name="address"><br><br>
            <label for="gender" style="color: indigo;">GENDER</label><br><br>
            <input type="gender" id="gender" name="gender"><br><br>
            <label for="place" style="color: indigo;">PLACE</label><br><br>
            <input type="place" id="place" name="place"><br><br>
            <label for="disease" style="color: indigo;">DISEASE</label><br><br>
            <input type="disease" id="disease" name="disease"><br><br>
            <button type="submit" class="btn btn-warning"><b style="color: white;">Submit</b></button>
        </form>
    </div>
</body>
</html>
